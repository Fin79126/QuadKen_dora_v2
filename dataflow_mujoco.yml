# MuJoCo Physics SITL Dataflow for QuadKen AUV
# Combines MuJoCo physics engine with dora-rs, providing virtual BNO055 & virtual underwater camera.
# Step 2: Autonomous Guidance, Navigation & Control (ai_guidance.py)
nodes:
  # ============================================================
  # PC PERCEPTION NODE (Step 3 Underwater Vision & Balloon Detector)
  # ============================================================
  - id: balloon_detector
    path: nodes/pc/balloon_detector.py
    inputs:
      image:
        source: mujoco_sim/image
        queue_size: 2
      bno_data:
        source: mujoco_sim/bno_data
        queue_size: 2
    outputs:
      - target_relative_info
      - image_annotated

  # ============================================================
  # PC AUTONOMOUS GUIDANCE & VISUALIZATION NODES (Step 2 GNC)
  # ============================================================
  - id: ai_guidance
    path: nodes/pc/ai_guidance.py
    inputs:
      tick: dora/timer/millis/20
      # Step 4: Fully Autonomous Perception-in-the-Loop Guidance
      target_relative_info:
        source: balloon_detector/target_relative_info
        queue_size: 5
      bno_data:
        source: mujoco_sim/bno_data
        queue_size: 5
    outputs:
      - control_cmd
      - guidance_status

  - id: compute
    path: nodes/pc/compute.py
    inputs:
      control_cmd:
        source: ai_guidance/control_cmd
        queue_size: 5
      bno_data:
        source: mujoco_sim/bno_data
        queue_size: 5
      esp_status:
        source: mujoco_sim/esp_status
        queue_size: 5
      esp_telemetry:
        source: mujoco_sim/esp_telemetry
        queue_size: 5
    outputs:
      - actuator_cmd
      - compute_status

  - id: visualizer
    path: nodes/pc/visualizer.py
    inputs:
      image:
        source: balloon_detector/image_annotated
        queue_size: 5
      image_overhead:
        source: mujoco_sim/image_overhead
        queue_size: 5
      bno_data:
        source: mujoco_sim/bno_data
        queue_size: 5
      control_cmd:
        source: ai_guidance/control_cmd
        queue_size: 5
      guidance_status:
        source: ai_guidance/guidance_status
        queue_size: 5
      compute_status:
        source: compute/compute_status
        queue_size: 5
      esp_status:
        source: mujoco_sim/esp_status
        queue_size: 5
      esp_telemetry:
        source: mujoco_sim/esp_telemetry
        queue_size: 5
      target_relative_info:
        source: balloon_detector/target_relative_info
        queue_size: 5
      target_relative_info_gt:
        source: mujoco_sim/target_relative_info
        queue_size: 5

  # ============================================================
  # MUJOCO DIGITAL TWIN SIMULATION NODE
  # Physics Engine + Virtual BNO055 IMU + Virtual Underwater Camera
  # ============================================================
  - id: mujoco_sim
    path: nodes/simulation/mujoco_node.py
    env:
      # Balloon Spawn Configuration:
      #   BALLOON_RANDOM_SPAWN: "true" (random spawn across pool) or "false" (fixed initial layout)
      #   BALLOON_RESPAWN_MODE: "batch" (respawn all 10 on clear) or "instant" (respawn immediately upon pop)
      BALLOON_RANDOM_SPAWN: "true"
      BALLOON_RESPAWN_MODE: "batch"
    inputs:
      tick: dora/timer/millis/20
      actuator_cmd:
        source: compute/actuator_cmd
        queue_size: 5
    outputs:
      - bno_data
      - image
      - image_overhead
      - esp_status
      - esp_telemetry
      - target_relative_info
